# Etapa 1: HTTP bàsic
# ====================
# - Nginx servint una web estàtica per HTTP (port 80)
# - Switch containeritzat (nginx-lab-switch) per a la xarxa interna
# - Client netshoot per a proves
# - Xarxa interna 10.20.0.0/24
#
# Desplegament: ./lab.sh deploy 1

name: http-lab-e1

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    switch:
      kind: linux
      image: nginx-lab-switch:latest
      exec:
        - switch-init.sh

    nginx:
      kind: linux
      image: nginx:alpine
      ports:
        - "80:80"
      binds:
        - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./configs/web/:/usr/share/nginx/html/:ro
      exec:
        - ip addr add 10.20.0.10/24 dev eth1
        - ip link set eth1 up

    client:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.20.0.20/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["nginx:eth1",  "switch:eth1"]
    - endpoints: ["client:eth1", "switch:eth2"]
