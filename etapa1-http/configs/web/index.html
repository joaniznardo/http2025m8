<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab HTTP — Etapa 1</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: white; border-radius: 12px; padding: 40px 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
  .badge { display: inline-block; background: #3b82f6; color: white; padding: 4px 16px; border-radius: 20px; font-size: 13px; margin-bottom: 16px; }
  h1 { color: #1e3a5f; font-size: 28px; margin: 0 0 8px 0; }
  h2 { color: #64748b; font-weight: normal; font-size: 16px; margin: 0 0 24px 0; }
  .info { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 12px 16px; text-align: left; border-radius: 4px; font-size: 14px; }
  .info p { margin: 4px 0; color: #374151; }
  .info code { background: #dbeafe; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">Etapa 1 — HTTP bàsic</div>
  <h1>Servidor Nginx</h1>
  <h2>Lab HTTP/S — Institut TIC de Barcelona</h2>
  <div class="info">
    <p><strong>Protocol:</strong> HTTP (port 80)</p>
    <p><strong>Servidor:</strong> <code>nginx:alpine</code></p>
    <p><strong>IP interna:</strong> <code>10.20.0.10</code></p>
    <p><strong>Estat nginx:</strong> <a href="/status">/status</a></p>
  </div>
</div>
</body>
</html>
