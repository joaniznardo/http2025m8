worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    upstream backend_web01 { server 10.20.0.11:80; }
    upstream backend_web02 { server 10.20.0.12:80; }
    upstream backend_web03 { server 10.20.0.13:80; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name web01.demohttp.publicvm.com;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/sites/proxy-headers.conf;

        location / {
            proxy_pass http://backend_web01;
            include /etc/nginx/sites/proxy-params.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name web02.demohttp.publicvm.com;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/sites/proxy-headers.conf;

        location / {
            proxy_pass http://backend_web02;
            include /etc/nginx/sites/proxy-params.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name web03.demohttp.publicvm.com;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/sites/proxy-headers.conf;

        location / {
            proxy_pass http://backend_web03;
            include /etc/nginx/sites/proxy-params.conf;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name demohttp.publicvm.com _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/sites/proxy-headers.conf;

        location / {
            proxy_pass http://backend_web01;
            include /etc/nginx/sites/proxy-params.conf;
        }

        location /status {
            stub_status on;
            allow 10.20.0.0/24;
            deny all;
        }
    }
}
