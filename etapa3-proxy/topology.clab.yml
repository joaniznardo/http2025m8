# Etapa 3: Reverse Proxy
# =======================
# - nginx-proxy: proxy invers amb virtual hosts per subdominis
# - web01/web02/web03: backends nginx estàtics
# - Switch containeritzat (nginx-lab-switch) per a la xarxa interna
#
# Subdominis:
#   demohttp.publicvm.com     → default (web01)
#   web01.demohttp.publicvm.com → web01 (10.20.0.11)
#   web02.demohttp.publicvm.com → web02 (10.20.0.12)
#   web03.demohttp.publicvm.com → web03 (10.20.0.13)
#
# /etc/hosts host: 127.0.0.1 demohttp.publicvm.com web01.demohttp.publicvm.com web02.demohttp.publicvm.com web03.demohttp.publicvm.com
#
# Desplegament: ./lab.sh deploy 3

name: http-lab-e3

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    switch:
      kind: linux
      image: nginx-lab-switch:latest
      exec:
        - switch-init.sh

    nginx-proxy:
      kind: linux
      image: nginx:alpine
      ports:
        - "80:80"
        - "443:443"
      binds:
        - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./configs/nginx/sites/:/etc/nginx/sites/:ro
        - ../certs/nginx.crt:/etc/nginx/certs/nginx.crt:ro
        - ../certs/nginx.key:/etc/nginx/certs/nginx.key:ro
      exec:
        - ip addr add 10.20.0.10/24 dev eth1
        - ip link set eth1 up

    web01:
      kind: linux
      image: nginx:alpine
      binds:
        - ./configs/web01/:/usr/share/nginx/html/:ro
      exec:
        - ip addr add 10.20.0.11/24 dev eth1
        - ip link set eth1 up

    web02:
      kind: linux
      image: nginx:alpine
      binds:
        - ./configs/web02/:/usr/share/nginx/html/:ro
      exec:
        - ip addr add 10.20.0.12/24 dev eth1
        - ip link set eth1 up

    web03:
      kind: linux
      image: nginx:alpine
      binds:
        - ./configs/web03/:/usr/share/nginx/html/:ro
      exec:
        - ip addr add 10.20.0.13/24 dev eth1
        - ip link set eth1 up

    client:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.20.0.20/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["nginx-proxy:eth1", "switch:eth1"]
    - endpoints: ["web01:eth1",       "switch:eth2"]
    - endpoints: ["web02:eth1",       "switch:eth3"]
    - endpoints: ["web03:eth1",       "switch:eth4"]
    - endpoints: ["client:eth1",      "switch:eth5"]
