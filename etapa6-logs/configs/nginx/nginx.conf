worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format combinat estàndard
    log_format combined_ext '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct=$upstream_connect_time '
                            'uht=$upstream_header_time urt=$upstream_response_time';

    # Format JSON per a processament automàtic
    log_format json_log escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"host":"$host",'
            '"upstream":"$upstream_addr"'
        '}';

    # Format mínim per a depuració
    log_format debug_fmt '[$time_local] $remote_addr "$request" '
                         '$status | host=$host | upstream=$upstream_addr';

    # Log global d'errors
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    upstream backend_web01 { server 10.20.0.11:80; }
    upstream backend_web02 { server 10.20.0.12:80; }
    upstream backend_web03 { server 10.20.0.13:80; }

    server {
        listen 80;
        server_name _;
        access_log /var/log/nginx/redirect.log combined_ext;
        return 301 https://$host$request_uri;
    }

    # web01 — log combinat + JSON
    server {
        listen 443 ssl;
        server_name web01.demohttp.publicvm.com;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log /var/log/nginx/web01/access.log   combined_ext;
        access_log /var/log/nginx/web01/access.json  json_log;
        error_log  /var/log/nginx/web01/error.log    warn;

        include /etc/nginx/sites/proxy-headers.conf;

        location / {
            proxy_pass http://backend_web01;
            include /etc/nginx/sites/proxy-params.conf;
        }
    }

    # web02 — log JSON + format debug
    server {
        listen 443 ssl;
        server_name web02.demohttp.publicvm.com;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log /var/log/nginx/web02/access.log   combined_ext;
        access_log /var/log/nginx/web02/access.json  json_log;
        error_log  /var/log/nginx/web02/error.log    warn;

        include /etc/nginx/sites/proxy-headers.conf;

        location / {
            proxy_pass http://backend_web02;
            include /etc/nginx/sites/proxy-params.conf;
        }
    }

    # web03 — log debug
    server {
        listen 443 ssl;
        server_name web03.demohttp.publicvm.com;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log /var/log/nginx/web03/access.log   combined_ext;
        access_log /var/log/nginx/web03/access.json  json_log;
        error_log  /var/log/nginx/web03/error.log    warn;

        include /etc/nginx/sites/proxy-headers.conf;

        location / {
            proxy_pass http://backend_web03;
            include /etc/nginx/sites/proxy-params.conf;
        }
    }

    # default
    server {
        listen 443 ssl default_server;
        server_name demohttp.publicvm.com _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log /var/log/nginx/access.log      combined_ext;
        access_log /var/log/nginx/access.json     json_log;
        error_log  /var/log/nginx/error.log       warn;

        include /etc/nginx/sites/proxy-headers.conf;

        location / {
            proxy_pass http://backend_web01;
            include /etc/nginx/sites/proxy-params.conf;
        }

        location /status {
            stub_status on;
            access_log off;
            allow 10.20.0.0/24;
            deny all;
        }
    }
}
