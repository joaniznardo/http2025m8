<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab HTTPS — Etapa 2</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0fdf4; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: white; border-radius: 12px; padding: 40px 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
  .badge { display: inline-block; background: #22c55e; color: white; padding: 4px 16px; border-radius: 20px; font-size: 13px; margin-bottom: 16px; }
  .lock { font-size: 48px; margin-bottom: 12px; }
  h1 { color: #14532d; font-size: 28px; margin: 0 0 8px 0; }
  h2 { color: #64748b; font-weight: normal; font-size: 16px; margin: 0 0 24px 0; }
  .info { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 12px 16px; text-align: left; border-radius: 4px; font-size: 14px; }
  .info p { margin: 4px 0; color: #374151; }
  .info code { background: #dcfce7; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">Etapa 2 — HTTPS mkcert</div>
  <div class="lock">🔒</div>
  <h1>Connexió segura</h1>
  <h2>Lab HTTP/S — Institut TIC de Barcelona</h2>
  <div class="info">
    <p><strong>Protocol:</strong> HTTPS (TLS 1.2/1.3)</p>
    <p><strong>Certificat:</strong> <code>mkcert</code> (dev CA local)</p>
    <p><strong>Port:</strong> <code>443</code> (HTTP→HTTPS redirect)</p>
    <p><strong>HSTS:</strong> Activat (max-age=31536000)</p>
  </div>
</div>
</body>
</html>
