# Etapa 2: HTTPS amb mkcert
# ==========================
# - Nginx amb HTTPS (port 443) + redirect HTTP→HTTPS
# - Certificats de desenvolupament generats amb mkcert
# - Switch containeritzat (nginx-lab-switch) per a la xarxa interna
# - Prerequisit: ./lab.sh certs
#
# Desplegament: ./lab.sh deploy 2

name: http-lab-e2

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    switch:
      kind: linux
      image: nginx-lab-switch:latest
      exec:
        - switch-init.sh

    nginx:
      kind: linux
      image: nginx:alpine
      ports:
        - "80:80"
        - "443:443"
      binds:
        - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./configs/web/:/usr/share/nginx/html/:ro
        - ../certs/nginx.crt:/etc/nginx/certs/nginx.crt:ro
        - ../certs/nginx.key:/etc/nginx/certs/nginx.key:ro
      exec:
        - ip addr add 10.20.0.10/24 dev eth1
        - ip link set eth1 up

    client:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.20.0.20/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["nginx:eth1",  "switch:eth1"]
    - endpoints: ["client:eth1", "switch:eth2"]
